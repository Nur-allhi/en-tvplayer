name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # Kept for the case where the community-fork workflow is ever used.
    # The solo workflow merges directly into dev and is covered by `push`.
    branches: [main, dev]

jobs:
  validate:
    name: Test · Lint · Build · Modularity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Modularity guard
        # Fails on NEW violations. The baseline (scripts/modularity-baseline.json)
        # records the v3.2.0 monoliths and shrinks as the v4 phases land.
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: node scripts/check-bundle-size.mjs

      - name: Formatting check
        # Only the files the pre-commit hook formats; legacy files are
        # reformatted on touch, never in a big-bang pass.
        run: npx prettier --check "player/src/**/*.{js,css}" "scripts/**/*.mjs"
        continue-on-error: true

  wgt:
    name: WGT packaging
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the WGT
        # Uses a throwaway key. NEVER commit tizen/author-key.pem — the real
        # signing key stays off-machine (docs/v4.PLAN.md §8).
        run: |
          npm run build
          npm run tizen
          ls -la stable/ beta/ 2>/dev/null || true

      - name: Upload the WGT
        uses: actions/upload-artifact@v4
        with:
          name: en-tvplayer-wgt
          path: |
            stable/*.wgt
            beta/*.wgt
          if-no-files-found: ignore
