<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>IPTV Player</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/src/styles.css">
  <!-- Samsung AVPlay (native fallback for streams the browser can't render).
       $WEBAPIS resolves on Tizen only; elsewhere this 404s harmlessly. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <div id="app">
    <!-- Channel List Sidebar -->
    <div id="sidebar" class="sidebar closed">
      <div class="sidebar-header">
        <span class="logo">
          <img src="logo.svg" class="logo-icon" width="48" height="48" alt="EN IPTV logo">
        </span>
        <span id="sidebar-title" class="sidebar-title">Groups</span>
      </div>
      <div id="channel-list" class="channel-list"></div>
      <div id="group-list" class="group-list hidden"></div>
    </div>

      <!-- Main Content -->
      <div id="main" class="main">

        <!-- Fullscreen left-edge hover zone to reveal the channel list -->
        <div id="sidebar-hover-zone" class="sidebar-hover-zone"></div>

        <!-- Fullscreen right-edge hover zone -->
        <div id="right-hover-zone" class="right-hover-zone"></div>

        <!-- Channel OSD (brief overlay when switching channels) -->
        <div id="channel-osd" class="channel-osd hidden"></div>

        <!-- Video Player -->
        <div id="player-container" class="player-container">
          <object id="avplayer" type="application/avplayer" class="avplayer hidden"></object>
          <video id="video" autoplay></video>
          <div id="player-watermark" class="player-watermark">
            <img src="logo.svg" class="watermark-icon" width="22" height="22" alt="">
            <span class="watermark-text">EN <span>IPTV</span></span>
          </div>
          <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span id="loading-name" class="loading-name">Loading</span>
          </div>
          <div id="resolution-badge" class="resolution-badge hidden">Auto</div>
          <div id="error" class="error hidden"></div>

          <!-- Buffering pill -->
          <div id="buffering-indicator" class="buffering-indicator hidden">
            <div class="spinner small"></div>
            <span>Buffering <span id="buffering-percent">0%</span><span id="buffering-hint" class="buffering-hint"></span></span>
          </div>

          <!-- Play/Pause status overlay -->
          <div id="play-state" class="play-state hidden">
            <div class="play-state-icon"><span></span><span></span></div>
          </div>

          <!-- Progress toast for right sidebar actions -->
          <div id="progress-toast" class="progress-toast hidden">
            <div class="progress-spinner"></div>
            <span id="progress-text">Loading</span>
          </div>
        </div>

        <!-- Now Playing Bar -->
        <div id="now-playing" class="now-playing">
          <span id="channel-name" class="channel-name">No Channel</span>
          <span id="channel-info" class="channel-info"></span>
          <button id="playpause-button" class="playpause-button" type="button">&#10073;&#10073;</button>
        </div>

      </div>

      <!-- Right Sidebar -->
      <div id="right-sidebar" class="right-sidebar closed">
        <div class="right-sidebar-header">
          <span class="right-sidebar-title">Menu</span>
        </div>
        <div class="right-sidebar-content">
          <div class="section-label">Quality</div>
          <div id="resolution-list-right" class="resolution-list-right"></div>
          <div class="section-label">Actions</div>
          <button id="refresh-stream-btn" class="right-sidebar-btn" type="button">&#8635; Reload Stream</button>
          <button id="refresh-channels-btn" class="right-sidebar-btn" type="button">&#8634; Refresh Channels</button>
          <button id="settings-btn" class="right-sidebar-btn" type="button">&#9881; Settings</button>
        </div>
      </div>

      <!-- Boot splash / loading overlay -->
      <div id="boot-splash" class="boot-splash hidden">
        <div class="boot-splash-content">
          <div class="boot-logo" id="boot-logo">
            <img src="logo.svg" class="boot-logo-icon" id="boot-logo-icon" width="120" height="120" alt="EN IPTV logo">
            <span class="boot-logo-text typing" id="boot-logo-text"></span>
          </div>
          <span id="boot-typewriter" class="boot-typewriter"></span>
          <div class="boot-loading" id="boot-loading">
            <div class="boot-spinner"></div>
            <span id="boot-status" class="boot-status">Updating playlist...</span>
          </div>
          <span id="boot-version" class="boot-version"></span>
        </div>
      </div>

      <!-- Settings Page (hidden by default) -->
      <div id="settings-page" class="settings-page hidden"></div>

      <!-- What's New modal -->
      <div id="whats-new-modal" class="whats-new-modal hidden">
        <div class="whats-new-box">
          <div class="whats-new-header">
            <h2>What's New</h2>
            <span id="whats-new-version" class="whats-new-version"></span>
          </div>
          <div id="whats-new-body" class="whats-new-body"></div>
          <div class="whats-new-footer">
            <button id="whats-new-close" class="btn btn-primary" type="button">Got it</button>
          </div>
        </div>
      </div>

      <!-- Confirm Dialog -->
      <div id="confirm-dialog" class="confirm-dialog hidden">
        <div class="confirm-dialog-box">
          <p id="confirm-dialog-message" class="confirm-dialog-message"></p>
          <div class="confirm-dialog-buttons">
            <button id="confirm-dialog-cancel" class="btn btn-secondary" type="button">Cancel</button>
            <button id="confirm-dialog-confirm" class="btn btn-primary" type="button">Confirm</button>
          </div>
        </div>
      </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
