<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f5f7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="rgba(237,66,31,0.10)"/>
      <stop offset="100%" stop-color="rgba(237,66,31,0)"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background — light plate -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradLight)"/>

  <!-- Soft accent halo -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#halo)"/>

  <!-- Hairline border -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="94.5" ry="94.5" fill="none" stroke="#E6E8EC" stroke-width="3"/>

  <!-- TV monitor outline — deeper accent for AA contrast on light -->
  <rect x="104" y="108" width="304" height="212" rx="28" ry="28" fill="none" stroke="#C8351A" stroke-width="14" stroke-linejoin="round"/>

  <!-- TV screen fill — soft accent tint -->
  <rect x="125" y="129" width="262" height="170" rx="16" ry="16" fill="rgba(237,66,31,0.07)"/>

  <!-- TV stand -->
  <path d="M208 320 L256 384 L304 320" fill="none" stroke="#C8351A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TV base -->
  <rect x="216" y="378" width="80" height="8" rx="4" ry="4" fill="#C8351A"/>

  <!-- Play button triangle inside screen -->
  <polygon points="238,176 310,214 238,252" fill="#ED421F"/>

  <!-- Signal bars top-left -->
  <rect x="136" y="128" width="6" height="24" rx="2" fill="#ED421F" opacity="0.30"/>
  <rect x="148" y="128" width="6" height="18" rx="2" fill="#ED421F" opacity="0.45"/>
  <rect x="160" y="128" width="6" height="12" rx="2" fill="#ED421F" opacity="0.22"/>

  <!-- Live dot top-right of screen -->
  <circle cx="355" cy="140" r="6" fill="#ED421F">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- App name under the mark -->
  <text x="256" y="448" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="4"><tspan fill="#141A23">EN </tspan><tspan fill="#ED421F">IPTV</tspan></text>
</svg>
